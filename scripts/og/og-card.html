<!doctype html>
<!--
  Source for the 1200x630 share cards. It pulls the live hero demo out of
  /index.html and styles it with the real landing.css, so the card always
  matches the landing page. Render both cards with: npm run og
    ?card=home    → public/og.jpg         (used by /)
    ?card=studio  → public/og-studio.jpg  (used by /app/)
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OG card</title>
<link rel="stylesheet" href="/src/landing/landing.css" />
<style>
  html, body.landing { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
  body.landing { position: relative; background: radial-gradient(900px 500px at 10% -20%, rgba(255, 255, 255, 0.05), transparent 70%), var(--page); }
  /* A still frame: every animation and transition lands on its end state. */
  *, *::before, *::after { animation: none !important; transition: none !important; }

  /* Left: copy, sized to stay legible when the card is shown at ~400px wide */
  .og-copy { position: absolute; left: 68px; top: 0; bottom: 0; width: 500px; z-index: 5; display: flex; flex-direction: column; justify-content: center; }
  .og-copy .logo { font-size: 26px; gap: 12px; margin-bottom: 44px; }
  .og-copy .logo svg { width: 32px; height: 32px; }
  .og-copy h1 { margin: 0; font-size: 76px; line-height: 1.02; letter-spacing: -0.045em; font-weight: 500; }
  .og-copy .lede { margin: 28px 0 0; font-size: 25px; line-height: 1.4; max-width: 19em; }
  .og-chips { margin-top: 36px; display: flex; gap: 10px; }
  .og-chips span { height: 36px; padding: 0 14px; display: inline-flex; align-items: center; gap: 8px; border-radius: 18px; background: rgba(255, 255, 255, 0.06); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08); font-size: 17px; font-weight: 500; color: var(--ink-2); }
  .og-chips .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--record, #ff1900); box-shadow: 0 0 0 4px rgba(255, 25, 0, 0.2); }

  /* Right: two different windows, fanned. Back: the Studio mid-take (big
     preview + record bar). Front: the editor (preview + timeline). No
     inspector in either, and nothing clipped except the front's right bleed. */
  .og-stack { position: absolute; left: 590px; top: 0; width: 610px; height: 630px; }
  .og-stack .demo { position: absolute; margin: 0; transform-origin: 0 0; height: auto; }
  .og-stack .demo[data-enter] { animation: none; }
  .og-stack .win { border-radius: 14px; }
  .og-stack .w-insp { display: none; }
  .og-stack .w-grid { grid-template-columns: minmax(0, 1fr); grid-template-areas: "viewer" "bottom"; }
  .og-back .bokeh { display: none; }
  .og-front .bokeh { inset: -90% -30% -30% -60%; -webkit-mask-image: none; mask-image: none; opacity: 0.8; }

  .og-back { left: 140px; top: 18px; transform: rotate(5deg); }
  .og-back .win { width: 720px; }
  .og-back .w-meta, .og-back .w-new, .og-back .w-export, .og-back .scenes { display: none; }
  .og-back .w-title::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: var(--record, #ff1900); vertical-align: 1px; }
  .og-back .w-bottom { height: 58px; }
  .og-back .w-viewer { height: 300px; }

  .og-front { left: 0; top: 290px; transform: rotate(-4deg); z-index: 2; }
  .og-front .win { width: 900px; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.14), -30px 50px 110px rgba(0, 0, 0, 0.75); }
  .og-front .w-viewer { height: 320px; }
  .og-front .w-bottom { height: 176px; }
  .og-front .w-new { display: none; }

  /* Quiet the recorded screen: keep the page header, chart and camera
     bubble; drop the popup, pointer, stat tiles and burned-in caption. */
  .og-stack .pop, .og-stack .ripple, .og-stack .p-ptr, .og-stack .cursor,
  .og-stack .b-stats, .og-stack .canvas > .caption, .og-stack .b-share { display: none !important; }
  .og-stack .b-chart { flex: 1; }
  /* Fit the whole recording inside each preview pane instead of cropping it. */
  .og-stack .stage { height: 100%; box-sizing: border-box; display: flex; justify-content: center; align-items: flex-start; }
  .og-stack .canvas { flex: none; width: var(--cw); transform: scale(var(--fit)); transform-origin: 50% 0; }
  .og-back { --cw: 696px; --fit: 0.7; }
  .og-front { --cw: 876px; --fit: 0.6; }
</style>
</head>
<body class="landing">
  <div class="og-copy">
    <span class="logo">
      <svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M5 0h6v1h-6zM5 1h7v1h-7zM3 2h2v1h-2zM10 2h2v1h-2zM3 3h1v1h-1zM11 3h1v1h-1zM2 4h2v1h-2zM2 5h2v1h-2zM12 5h2v1h-2zM2 6h2v1h-2zM12 6h2v1h-2zM2 7h2v1h-2zM12 7h2v1h-2zM2 8h2v1h-2zM8 8h2v1h-2zM12 8h2v1h-2zM2 9h2v1h-2zM8 9h2v1h-2zM12 9h2v1h-2zM2 10h2v1h-2zM9 10h5v1h-5zM3 11h2v1h-2zM10 11h4v1h-4zM3 12h3v1h-3zM10 12h4v1h-4zM5 13h9v1h-9zM6 14h5v1h-5zM13 14h3v1h-3zM14 15h2v1h-2z" /><path fill="#ff1900" d="M12 0h4v1h-4zM12 1h4v1h-4zM12 2h4v1h-4zM12 3h4v1h-4zM12 4h4v1h-4z" /></svg>
      <span id="brand">Quicksnap</span>
    </span>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <p class="og-chips" id="chips"></p>
  </div>
  <div class="og-stack" id="slot"></div>

<script type="module">
  const CARDS = {
    home: {
      title: 'Screen recordings that look <span class="sel"><span>edited.</span></span>',
      lede: "Record, zoom, caption and export in one browser tab.",
      chips: ["Free", "No sign-up", "No upload"],
    },
    studio: {
      brand: "Quicksnap Studio",
      title: 'Record it. <span class="sel"><span>Edit it.</span></span> Export it.',
      lede: "Screen, camera and mic, then zooms, captions and cuts. All in your browser.",
      chips: ['<i class="dot"></i>Record', "Edit", "Export"],
    },
  };
  const card = CARDS[new URLSearchParams(location.search).get("card")] ?? CARDS.home;
  if (card.brand) document.getElementById("brand").textContent = card.brand;
  document.getElementById("title").innerHTML = card.title;
  document.getElementById("lede").textContent = card.lede;
  document.getElementById("chips").innerHTML = card.chips.map((c) => `<span>${c}</span>`).join("");

  // Clone the hero demo from the landing page itself, once per window.
  const html = await (await fetch("/")).text();
  const src = new DOMParser().parseFromString(html, "text/html").getElementById("demo");
  const make = (phase) => {
    const demo = src.cloneNode(true);
    demo.removeAttribute("id");
    demo.dataset.phase = phase;
    delete demo.dataset.zoom; // show the whole page, not the zoomed-in crop
    if (phase === "rec") {
      for (const k of ["suggest", "accept", "caps", "captions", "done"]) delete demo.dataset[k];
      demo.querySelector(".clock").textContent = "00:00:42";
      demo.querySelector(".rec-label").textContent = "Stop";
      demo.querySelector(".w-title").textContent = "Studio";
    } else {
      delete demo.dataset.done; // show Export, not the post-export "Saved" state
    }
    return demo;
  };
  // Same stack on both cards: the take at the back, the finished edit in front.
  const [back, front] = [make("rec"), make("edit")];
  back.classList.add("og-back");
  front.classList.add("og-front");
  document.getElementById("slot").append(back, front);

  for (const [demo, k] of [[back, 0.56], [front, 0.56]]) {
    demo.style.setProperty("--k", String(k));
    demo.style.setProperty("--h", `${Math.round(demo.querySelector(".win").offsetHeight * k)}px`);
  }
  await document.fonts.ready;
  document.documentElement.dataset.ready = "";
</script>
</body>
</html>
