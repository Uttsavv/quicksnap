<!doctype html>
<!--
  Source for the 1200x630 share cards. It pulls the live hero demo out of
  /index.html and styles it with the real landing.css, so the card always
  matches the landing page. Render both cards with: npm run og
    ?card=home    → public/og.jpg         (the finished edit; used by /)
    ?card=studio  → public/og-studio.jpg  (mid-recording; used by /app/)
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OG card</title>
<link rel="stylesheet" href="/src/landing/landing.css" />
<style>
  html, body.landing { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
  body.landing { position: relative; background: radial-gradient(900px 500px at 10% -20%, rgba(255, 255, 255, 0.05), transparent 70%), var(--page); }
  *, *::before, *::after { animation-play-state: paused !important; transition: none !important; }

  /* Left: copy, sized to stay legible when the card is shown at ~400px wide */
  .og-copy { position: absolute; left: 68px; top: 0; bottom: 0; width: 500px; z-index: 5; display: flex; flex-direction: column; justify-content: center; }
  .og-copy .logo { font-size: 26px; gap: 12px; margin-bottom: 44px; }
  .og-copy .logo svg { width: 32px; height: 32px; }
  .og-copy h1 { margin: 0; font-size: 76px; line-height: 1.02; letter-spacing: -0.045em; font-weight: 500; }
  .og-copy .lede { margin: 28px 0 0; font-size: 25px; line-height: 1.4; max-width: 19em; }
  .og-chips { margin-top: 36px; display: flex; gap: 10px; }
  .og-chips span { height: 36px; padding: 0 14px; display: inline-flex; align-items: center; gap: 8px; border-radius: 18px; background: rgba(255, 255, 255, 0.06); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08); font-size: 17px; font-weight: 500; color: var(--ink-2); }
  .og-chips .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--record, #ff1900); box-shadow: 0 0 0 4px rgba(255, 25, 0, 0.2); }

  /* Right: the real editor window, bleeding off the right edge like the hero */
  .og-demo { position: absolute; left: 610px; top: 0; width: 900px; height: 630px; }
  .og-demo .demo { position: absolute; left: 0; top: 50%; margin: 0; transform: translateY(-50%); }
  .og-demo .demo[data-enter] { animation: none; }
  .og-demo .bokeh { inset: -30% -20% -30% -60%; -webkit-mask-image: none; mask-image: none; }
</style>
</head>
<body class="landing">
  <div class="og-copy">
    <span class="logo">
      <svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M5 0h6v1h-6zM5 1h7v1h-7zM3 2h2v1h-2zM10 2h2v1h-2zM3 3h1v1h-1zM11 3h1v1h-1zM2 4h2v1h-2zM2 5h2v1h-2zM12 5h2v1h-2zM2 6h2v1h-2zM12 6h2v1h-2zM2 7h2v1h-2zM12 7h2v1h-2zM2 8h2v1h-2zM8 8h2v1h-2zM12 8h2v1h-2zM2 9h2v1h-2zM8 9h2v1h-2zM12 9h2v1h-2zM2 10h2v1h-2zM9 10h5v1h-5zM3 11h2v1h-2zM10 11h4v1h-4zM3 12h3v1h-3zM10 12h4v1h-4zM5 13h9v1h-9zM6 14h5v1h-5zM13 14h3v1h-3zM14 15h2v1h-2z" /><path fill="#ff1900" d="M12 0h4v1h-4zM12 1h4v1h-4zM12 2h4v1h-4zM12 3h4v1h-4zM12 4h4v1h-4z" /></svg>
      <span id="brand">Quicksnap</span>
    </span>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
    <p class="og-chips" id="chips"></p>
  </div>
  <div class="og-demo" id="slot"></div>

<script type="module">
  const CARDS = {
    home: {
      title: 'Screen recordings that look <span class="sel"><span>edited.</span></span>',
      lede: "Record, zoom, caption and export in one browser tab.",
      chips: ["Free", "No sign-up", "No upload"],
      phase: "edit",
    },
    studio: {
      brand: "Quicksnap Studio",
      title: 'Hit record. <span class="sel"><span>Ship it.</span></span>',
      lede: "Screen, camera and mic in your browser. Nothing leaves your device.",
      chips: ['<i class="dot"></i>Record', "Zoom", "Caption"],
      phase: "rec",
    },
  };
  const card = CARDS[new URLSearchParams(location.search).get("card")] ?? CARDS.home;
  if (card.brand) document.getElementById("brand").textContent = card.brand;
  document.getElementById("title").innerHTML = card.title;
  document.getElementById("lede").textContent = card.lede;
  document.getElementById("chips").innerHTML = card.chips.map((c) => `<span>${c}</span>`).join("");

  // Clone the hero demo from the landing page itself.
  const html = await (await fetch("/")).text();
  const demo = new DOMParser().parseFromString(html, "text/html").getElementById("demo");
  demo.dataset.phase = card.phase;
  if (card.phase === "rec") {
    for (const k of ["suggest", "accept", "caps", "zoom", "captions", "done"]) delete demo.dataset[k];
    demo.querySelector(".clock").textContent = "00:00:42";
    demo.querySelector(".rec-label").textContent = "Stop";
  }
  document.getElementById("slot").append(demo);

  // Fit the 1080px-wide window to the card's height, leaving a margin.
  const win = demo.querySelector(".win");
  const k = Math.min(0.78, 540 / win.offsetHeight);
  demo.style.setProperty("--k", String(k));
  demo.style.setProperty("--h", `${Math.round(win.offsetHeight * k)}px`);
  await document.fonts.ready;
  document.documentElement.dataset.ready = "";
</script>
</body>
</html>
